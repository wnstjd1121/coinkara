<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>코인노래방 키우기 - 업데이트 중</title>
<style>
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#1a1030;color:#fff;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.card{max-width:340px;width:100%;background:#2a1b4d;border:2px solid #6b4fb3;border-radius:18px;padding:32px 22px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.ic{font-size:48px;line-height:1}
h1{font-size:20px;margin:16px 0 10px;color:#ffd34d}
p{font-size:15px;line-height:1.6;margin:6px 0;color:#e7defa}
.sm{font-size:13px;color:#b9a9dd;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<div class="ic">🛠️</div>
<h1>대규모 업데이트 중이에요</h1>
<p>더 재미있는 코인노래방 키우기를 만들고 있어요.<br>업데이트가 끝날 때까지 잠시 기다려 주세요.</p>
<p class="sm">저장된 데이터는 그대로 안전해요.</p>
</div>
</body>
</html>
