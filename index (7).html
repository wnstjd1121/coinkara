#st{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 38%,#4a1a63,#0e0614 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
.stt{font-size:30px;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 0 6px #ff3fa4,0 0 18px #ff3fa4}
.stb{padding:14px 58px;border-radius:14px;border:2px solid var(--gold);background:linear-gradient(#6b2a56,#33122c);color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 0 #000}
.stb:active{transform:translateY(3px);box-shadow:none}.stv{position:absolute;bottom:16px;font-size:11px;color:var(--mut)}
#tut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(50dvh + 8px);width:min(92%,420px);z-index:90;display:none;background:linear-gradient(#2a1f33,#14091c);border:2px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.55;box-shadow:0 4px 18px #000c}
#tut .tr{display:flex;justify-content:space-between;align-items:center;margin-top:8px}#tut small{color:var(--mut);font-size:12px}
#tut button{padding:7px 18px;border-radius:8px;border:1px solid var(--gold);background:linear-gradient(#6b2a56,#33122c);color:#fff;font-weight:800;font-size:14px}
#tut button.sk{border:0;background:none;color:var(--mut);font-weight:600;font-size:12px;padding:7px 4px}
.tl{outline:3px solid #ffd34d;outline-offset:-3px;border-radius:8px}
.sr{display:flex;align-items:center;gap:10px;margin:14px 0}.sr span{width:54px;font-size:14px;font-weight:700}.sr input{flex:1;accent-color:#ff3fa4;height:28px}
.evt{font-size:17px;font-weight:800;line-height:1.5;text-align:center;margin-bottom:12px}
.evr{display:flex;gap:8px;margin-top:10px}.evr button,.ch button{flex:1;padding:11px 4px;border-radius:9px;border:1px solid #4a3a2a;background:linear-gradient(#3a2c40,#1a1222);color:#fff;font-weight:800;font-size:14px}
.evr button.pr,.fc button{border-color:var(--gold);background:linear-gradient(#6b2a56,#33122c)}
.ch{display:flex;gap:6px;margin:8px 0}.ch button{padding:8px 0;font-size:13px}
.bm{text-align:center;font-size:24px;font-weight:900;color:var(--gold);margin:4px 0}.evs{text-align:center;font-size:12px;color:var(--mut);margin-top:6px}
#bsl{width:100%;accent-color:#ff3fa4;height:30px}
.fc{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:8px 0}.fc button{padding:12px 0;border-radius:8px;border:1px solid var(--gold);color:#fff;font-size:18px;font-weight:900}
.rc.mb:before,.rc.mb:after{content:"";position:absolute;inset:2px;border-radius:10px;pointer-events:none;opacity:.2;animation:tw 4.4s ease-in-out infinite alternate;background:
radial-gradient(circle,#ff9be0 0 1.6px,#0000 2.4px) 0 0/16px 6px repeat-x,
radial-gradient(circle,#ff9be0 0 1.6px,#0000 2.4px) 0 100%/16px 6px repeat-x,
radial-gradient(circle,#ff9be0 0 1.6px,#0000 2.4px) 0 0/6px 16px repeat-y,
radial-gradient(circle,#ff9be0 0 1.6px,#0000 2.4px) 100% 0/6px 16px repeat-y}
.rc.mb:after{background-position:8px 0,8px 100%,0 8px,100% 8px;filter:hue-rotate(150deg);animation-delay:-2.2s}
@keyframes tw{to{opacity:.85}}

.cups{position:relative;height:112px;margin:14px 0 6px}
.cup{position:absolute;top:34px;width:20%;height:76px;padding:0;border:0;background:none;transition:left .3s ease-in-out,top .17s}
.cup .cs{display:block;position:relative;z-index:2;transition:transform .35s}.cup .cs svg{display:block;width:100%;height:64px}.cup.lift .cs{transform:translateY(-36px)}
.cup .dc{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:22px;line-height:1;z-index:1}
.die{display:inline-block;min-width:30px;padding:3px 0;border-radius:7px;background:#fff;color:#c0392b;font-size:20px;font-weight:900;box-shadow:0 2px 0 #aaa}

if(tab==0){let h='<div class="chips2"><span>노래중 <b id="us">0</b></span><span>완료 대기 <b id="wt">0</b></span><span>오늘 손님 <b id="pc">0</b>팀</span></div><div id="grid2">';
for(let i=0;i<NR;i++){const u=S.ru[i];h+='<div class="rc s0'+(u.m?' mb':'')+'" id="r'+i+'"><div class="rh"><b>'+(i+1)+'번방</b><span>'+(u.m?"🪩":"")+(u.r?"🎵":"")+(u.p?"👑":"")+'</span></div><div class="ri"></div><div class="rg"><i></i><em></em></div><div class="rs"></div></div>'}
p.innerHTML=h+'</div>';rooms.forEach(r=>r.vs=-1);cacheRooms()}
else if(tab==1)p.innerHTML='<div class="chips2"><span>자판기에 채워야 팔려요 · 주문을 꾹 누르면 계속 주문</span></div><div class="sec">🥤 음료수</div>'+DR.map(whRow).join("")+'<div class="sec">🍪 과자</div>'+SN.map(whRow).join("");
else if(tab==2){let ln="";for(let i=0;i<vN();i++)ln+='<div class="ln"><span id="lk'+i+'">대기</span><div class="bar"><i id="lb'+i+'"></i></div></div>';
const mx=S.vc>=VMAX,mt=S.vs>=VSMAX;
p.innerHTML='<div class="vm"><div class="vt">COIN VENDING</div><div class="vg">'+DR.map(slot).join("")+SN.map(slot).join("")+'<div class="sl"></div></div><div class="vb"><div class="vc"></div><div class="vtr">▼ 가져가세요</div></div></div>'+
'<button class="fillb" id="fillb">창고 재고로 자판기 채우기</button>'+
'<div class="chips2"><span>재고가 없으면 직접 채우거나 매니저가 채워요</span></div>'+
'<div class="sec">📦 배출 현황 · 대기 <b id="vqn" style="color:#fff">0</b>개</div><div class="vs">'+ln+'</div>'+
'<div class="sec">🔧 자판기 업그레이드</div>'+
'<div class="pm"><div class="av">🥤</div><div class="m"><div class="a">동시 배출 개수</div><div class="b">현재 '+vN()+'개'+(mx?" (최대)":" → "+(vN()+1)+"개")+'</div></div>'+(mx?'<span class="hd2">최대</span>':'<button class="hb" data-vu="c" data-c="'+vcCost()+'">'+num(vcCost())+'</button>')+'</div>'+
'<div class="pm"><div class="av">⏱️</div><div class="m"><div class="a">배출 시간</div><div class="b">현재 '+vT().toFixed(1)+'초'+(mt?" (최소)":" → "+Math.max(1,vT()-.8).toFixed(1)+"초")+'</div></div>'+(mt?'<span class="hd2">최소</span>':'<button class="hb" data-vu="s" data-c="'+vsCost()+'">'+num(vsCost())+'</button>')+'</div>'}
else if(tab==3){let h='<div class="chips2"><span>손님 유입 <b id="pmx">x'+pm().toFixed(2)+'</b></span><span>홍보할수록 손님이 늘어나요</span></div>';
PROMO.forEach((p,k)=>{h+='<div class="pm'+(S.pr[k]?" on":"")+'"><div class="av">'+p[0]+'</div><div class="m"><div class="a">'+p[1]+'</div><div class="b">손님 유입 +'+Math.round(p[3]*100)+'%</div></div>'+(S.pr[k]?'<span class="hd2">진행중</span>':'<button class="hb" data-p="'+k+'" data-c="'+p[2]+'">'+num(p[2])+'</button>')+'</div>'});p.innerHTML=h}
else if(tab==4){const ub=(i,k,ic,nm,ef,c,done)=>'<button class="ub2'+(done?" dn3":"")+'" '+(done?"":'data-ru="'+i+':'+k+'" data-c="'+c+'"')+'><div class="u1">'+ic+' '+nm+'</div><div class="u2">'+ef+'</div><div class="u3">'+(done?"✔ 설치됨":num(c))+'</div></button>';
let h='<div class="chips2"><span>미러볼 1.2배 · 예약 1.6배 · 둘 다 1.8배</span></div>';
for(let i=0;i<NR;i++){const u=S.ru[i];h+='<div class="uc"><div class="uh"><b>'+(i+1)+'번방</b><div class="cp"><span>노래 속도 <b>x'+mult(i).toFixed(1)+'</b></span><span>인원 <b>'+capOf(i)+'명</b></span><span>최대 <b>'+maxSongs(i)+'곡</b></span><span>곡당 <b>'+num(priceOf(i))+'</b></span></div></div><div class="ug">'+
ub(i,"m","🪩","미러볼","노래 1.2배 빠르게",240000,u.m)+ub(i,"r","🎵","노래 예약","노래 1.6배 빠르게",600000,u.r)+ub(i,"p","👑","VIP룸","곡당 2,000",200000,u.p)+
(u.c>=6?'<button class="ub2 dn3"><div class="u1">👥 수용인원</div><div class="u2">최대 8명</div><div class="u3">✔ 최대</div></button>':ub(i,"c","👥","수용인원 +1",capOf(i)+"명 → "+(capOf(i)+1)+"명 · 곡당 +500 · 최대 +5곡",100000,0))+'</div></div>'}
p.innerHTML=h}
else{let h='<div class="chips2"><span>고용 <b>'+S.hr.filter(x=>x).length+'/8명</b></span></div>';
HN.forEach((nm,k)=>{const on=S.hr[k];h+='<div class="al'+(on?" on":"")+'"><div class="av">'+HE[k]+'</div><div class="m"><div class="a">'+nm+'</div><div class="b2">'+HD[k]+'</div>'+(on?'<div class="st" id="as'+k+'"></div>':'')+'</div>'+(on?'<span class="hd2">고용됨</span>':'<button class="hb" data-h="'+k+'" data-c="'+HP[k]+'">'+num(HP[k])+'</button>')+'</div>'});p.innerHTML=h}}
function setTab(n){stopHold();tab=n;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",+x.dataset.t==n));build();draw()}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(b)setTab(+b.dataset.t)});
$("panel").addEventListener("click",e=>{let t=e.target.closest("[data-d]");if(t){const i=+t.dataset.d,r=rooms[i];if(r.st==3)startClean(r,i);draw();return}
if(e.target.closest("#fillb")){fillAll();draw();return}
t=e.target.closest("[data-h]");if(t){const k=+t.dataset.h;if(!S.hr[k]&&S.money>=HP[k]){S.money-=HP[k];S.hr[k]=1;coin();build()}return}
t=e.target.closest("[data-p]");if(t){const k=+t.dataset.p;if(!S.pr[k]&&S.money>=PROMO[k][2]){S.money-=PROMO[k][2];S.pr[k]=1;coin();build()}return}
t=e.target.closest("[data-x]");if(t){const k=t.dataset.x;if(maxOf(k)>=300)return;const c=upCost(k);if(S.money>=c){S.money-=c;S.sl[k]++;coin();build()}return}
t=e.target.closest("[data-vu]");if(t){if(t.dataset.vu=="c"&&S.vc<VMAX&&S.money>=vcCost()){S.money-=vcCost();S.vc++;coin();build()}else if(t.dataset.vu=="s"&&S.vs<VSMAX&&S.money>=vsCost()){S.money-=vsCost();S.vs++;coin();build()}return}
t=e.target.closest("[data-ru]");if(t){const[i,k]=t.dataset.ru.split(":"),u=S.ru[i],c=({m:240000,r:600000,p:200000,c:100000})[k];if(S.money>=c){if(k=="c"){if(u.c<6){S.money-=c;u.c++;coin();build()}}else if(!u[k]){S.money-=c;u[k]=1;coin();build()}}}});
let hold=null;
function doOrder(k){const it=ALL.find(x=>x[0]==k),q=Math.min(10,maxOf(k)-S.stock[k]),c=q*it[3];if(q>0&&S.money>=c){S.money-=c;S.stock[k]+=q;return true}return false}
function stopHold(){if(hold){clearTimeout(hold.d);clearInterval(hold.i);hold=null}}
$("panel").addEventListener("pointerdown",e=>{const t=e.target.closest("[data-o]");if(!t)return;const k=t.dataset.o;stopHold();doOrder(k);draw();const h=hold={};h.d=setTimeout(()=>{h.i=setInterval(()=>{if(!doOrder(k))stopHold()},110)},350)});
["pointerup","pointercancel","blur"].forEach(v=>window.addEventListener(v,stopHold));
function startClean(r,i,by=-1){r.st=4;r.clean=0;r.by=by;r.ct=by>=0?cleanT(by,Math.floor(S.gm/60)):S.cleanT}
function offToggle(){document.querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("off",S.money<+b.dataset.c))}
const TX=(e,v)=>{if(e&&e._v!==v){e._v=v;e.textContent=v}},WD=(e,v)=>{if(e&&e._w!==v){e._w=v;e.style.width=v}};
let RE=[];
function cacheRooms(){RE=[];for(let i=0;i<NR;i++){const e=$("r"+i);RE.push(e?{e,ri:e.querySelector(".ri"),rs:e.querySelector(".rs"),gi:e.querySelector(".rg i"),em:e.querySelector(".rg em"),v:null}:null)}}
function draw(){if(tab==0){let us=0,wt=0;rooms.forEach((r,i)=>{const o=RE[i];if(!o)return;if(r.st==2)us++;if(r.st==3)wt++;
if(r.vs!==r.st){r.vs=r.st;o.e.className="rc s"+r.st+(S.ru[i].m?" mb":"");
o.ri.innerHTML=r.st==2?MIC:r.st==1?"🚶":r.st==3?"🎶":r.st==4?"🧹":"🚪";
o.rs.innerHTML=r.st==0?'<span class="tx2">빈방</span>':r.st==1?'<span class="tx2">입실중</span>':r.st==2?'<span class="tx2">노래중 <b class="v"></b></span>':r.st==3?'<button class="dn" data-d="'+i+'">완료</button>':'<span class="tx2">청소중 <b class="v"></b></span>';
o.v=o.rs.querySelector(".v");if(o.v)o.v._v=null;o.em._v=null;o.gi._w=null}
let pct=0,tx="";
if(r.st==2){pct=(r.total-r.songs+r.t/(r.sd||SONG))/r.total;tx=(r.total-r.songs)+"/"+r.total}
else if(r.st==3)pct=1;else if(r.st==4){pct=r.clean/r.ct;tx=Math.max(0,Math.ceil(r.ct-r.clean))+"초"}
TX(o.v,tx);WD(o.gi,Math.min(100,pct*100).toFixed(0)+"%");TX(o.em,r.st>=2?Math.round(Math.min(1,pct)*100)+"%":"")});
TX($("us"),us);TX($("wt"),wt);TX($("pc"),S.parties)}
else if(tab==1){ALL.forEach(it=>{const k=it[0],mx=maxOf(k),q=Math.min(10,mx-S.stock[k]),b=$("ob_"+k);if(!b)return;TX($("sw_"+k),S.stock[k]);TX($("sm_"+k),mx);WD($("sb_"+k),(S.stock[k]/mx*100).toFixed(0)+"%");
b.dataset.c=q>0?q*it[3]:1e18;const h=q>0?"+"+q+" 주문 "+num(q*it[3]):"가득 참";if(b._h!==h){b._h=h;b.innerHTML=h}});offToggle()}
else if(tab==2){ALL.forEach(it=>{const e=$("sv_"+it[0]);if(e){TX(e,S.vm[it[0]]);$("v_"+it[0]).classList.toggle("out",S.vm[it[0]]<=0)}});
TX($("vqn"),S.vq.length);for(let i=0;i<vN();i++){const l=lanes[i],k=$("lk"+i),b=$("lb"+i);if(!k||!l)continue;const it=l.k&&ALL.find(x=>x[0]==l.k);TX(k,it?it[1]+" 배출중":"대기");WD(b,it?Math.min(100,l.p/vT()*100).toFixed(0)+"%":"0%")}offToggle()}
else if(tab==5){const h=Math.floor(S.gm/60),bz={};rooms.forEach((r,i)=>{if(r.st==4&&r.by>=0)bz[r.by]=i+1});
HN.forEach((nm,k)=>{const e=$("as"+k);if(!e)return;TX(e,k==4?"자판기 채우기 1초에 "+mgrRate()+"개":"청소 "+cleanT(k,h)+"초 · "+(bz[k]?bz[k]+"번방 청소중":"대기"))});offToggle()}

{v:"0.4.0",d:"2026-10-04",n:["피버타임, 홍보, 창고 확장"]},
{v:"0.3.0",d:"2026-10-04",n:["창고·자판기, 방 업그레이드"]},

function seen(v){try{if(v)localStorage.setItem("kara_seen",VER);return localStorage.getItem("kara_seen")}catch(e){return VER}}
$("nw").style.display=seen()==VER?"none":"inline-block";
$("pt").onclick=()=>{seen(1);$("nw").style.display="none";$("pl").innerHTML=PATCH.map(p=>'<div class="pv"><div class="ph2"><b>v'+p.v+'</b>'+(p.v==VER?'<em>NEW</em>':'')+'<span>'+p.d+'</span></div><ul>'+p.n.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>').join("");$("pq").querySelector(".qh").textContent="📋 패치내용 · 현재 버전 v"+VER;$("pq").style.display="flex"};
$("pc2").onclick=()=>$("pq").style.display="none";
async function chkUpd(){try{const r=await fetch(location.href.split("#")[0],{cache:"no-store",headers:{Range:"bytes=0-2047"}});if(!r.ok)return;const x=(await r.text()).slice(0,4096),m=x.match(/name="game-version" content="([^"]+)"/);
if(m&&m[1]!==VER){save();const u=$("ut");u.textContent="🔄 새 버전 v"+m[1]+" 업데이트! 잠시 후 새로고침돼요";u.style.display="block";setTimeout(()=>location.reload(),2500)}}catch(e){}}
setTimeout(chkUpd,20000);setInterval(()=>{if(!document.hidden)chkUpd()},180000);
// ---- audio / settings ----
const SET=(()=>{const d={br:100,bg:50,fx:70};try{return Object.assign(d,JSON.parse(localStorage.getItem("coinkara3s")))}catch(e){return d}})();
let AC=null,gs=null,gb=null,sfxBuf=null,bgmEl=null,started=false;
const lv=v=>Math.pow(v/100,2);
function applyBr(){$("dim").style.opacity=((100-SET.br)/100*.8).toFixed(2)}
function applyVol(){if(gs){gs.gain.value=lv(SET.fx)}if(gb)gb.gain.value=lv(SET.bg);else if(bgmEl)bgmEl.volume=lv(SET.bg)}
function saveSet(){try{localStorage.setItem("coinkara3s",JSON.stringify(SET))}catch(e){}}
function initAudio(){if(AC||bgmEl)return;
try{AC=new(window.AudioContext||window.webkitAudioContext)();gs=AC.createGain();gs.connect(AC.destination);
const bin=atob(SFX),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
AC.decodeAudioData(u.buffer,b=>{sfxBuf=b},()=>{})}catch(e){AC=null}
try{bgmEl=new Audio("bgm.mp3");bgmEl.loop=true;bgmEl.preload="auto";
if(AC){gb=AC.createGain();gb.connect(AC.destination);AC.createMediaElementSource(bgmEl).connect(gb)}}catch(e){gb=null}
applyVol()}
function bgmOn(){if(!started||document.hidden)return;try{if(AC&&AC.state!="running")AC.resume().catch(()=>{})}catch(x){}if(bgmEl&&bgmEl.paused)bgmEl.play().catch(()=>{})}
const bgmKick=()=>{if(started&&!document.hidden&&bgmEl&&SET.bg>0&&(bgmEl.paused||(AC&&AC.state!="running")))bgmOn()};
["pointerdown","touchend","click"].forEach(v=>document.addEventListener(v,bgmKick,{passive:true}));["pageshow","focus"].forEach(v=>window.addEventListener(v,()=>setTimeout(bgmOn,200)));
function coin(){if(!AC||!sfxBuf||SET.fx<=0)return;try{const s=AC.createBufferSource();s.buffer=sfxBuf;s.connect(gs);s.start()}catch(e){}}
[["s_br","br"],["s_bg","bg"],["s_fx","fx"]].forEach(([id,k])=>{const e=$(id);e.value=SET[k];e.oninput=()=>{SET[k]=+e.value;applyBr();applyVol();saveSet()};e.onchange=()=>{if(k=="fx")coin()}});
applyBr();
$("sg").onclick=()=>{$("sp").style.display="flex"};$("sc").onclick=()=>$("sp").style.display="none";
// ---- random event: shell game ----
const EVT=600;let evOpen=false,G=null;
const rnd=n=>{if(!window.crypto||!crypto.getRandomValues)return Math.floor(Math.random()*n);const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n};
const CUP='<svg viewBox="0 0 40 50"><path d="M8 8H32L28 46H12Z" fill="#c0392b" stroke="#5a1410" stroke-width="1.4"/><rect x="5" y="3" width="30" height="7" rx="3.5" fill="#e8584a" stroke="#5a1410" stroke-width="1.2"/><path d="M13 14L16 42" stroke="#fff" stroke-opacity=".35" stroke-width="2.4"/></svg>';
const evB=h=>{$("evb").innerHTML=h};
function modalOpen(){return !started||tutOn||["qz","pq","of","ev","sp"].some(id=>$(id).style.display=="flex")}
function offerEvent(){evOpen=true;S.ev=0;evB('<div class="evt">야바위 한판 어때요?<br><small style="color:var(--mut);font-weight:600">가진 돈으로 배팅해요</small></div><div class="evr"><button data-a="no">거절</button><button class="pr" data-a="yes">수락</button></div>');$("ev").style.display="flex"}
function evClose(){evOpen=false;G=null;S.ev=0;$("ev").style.display="none"}
function betStep(){if(S.money<10){evB('<div class="evt">배팅할 돈이 부족해요</div><div class="evr"><button data-a="no">확인</button></div>');return}
evB('<div class="evt">배팅 금액을 정하세요</div><div class="bm" id="bm"></div><input type="range" id="bsl" min="1" max="100" value="10"><div class="ch"><button data-p="10">10%</button><button data-p="25">25%</button><button data-p="50">50%</button><button data-p="100">전부</button></div><div class="evs">컵 맞히면 +1.5배 · 틀리면 -0.5배</div><div class="evr"><button data-a="no">그만두기</button><button class="pr" data-a="go">배팅</button></div>');betShow()}
const betAmt=()=>Math.max(1,Math.floor(S.money*(+$("bsl").value)/100));
function betShow(){const e=$("bm");if(e)e.textContent=num(betAmt())}
let gid=0;
const dieB=n=>'<span class="die">'+n+'</span>';
function cupHtml(i){return '<button class="cup" data-c="'+i+'" disabled style="left:'+i*20+'%">'+(i==G.pos?'<span class="dc">🎲</span>':'')+'<span class="cs">'+CUP+'</span></button>'}
function cupStep(){G={bet:betAmt(),pos:rnd(5),sl:[0,1,2,3,4],id:++gid};const id=G.id;let c='';for(let i=0;i<5;i++)c+=cupHtml(i);
evB('<div class="evt" id="evt">주사위를 잘 보세요!</div><div class="cups" id="cups">'+c+'</div><div class="evs">배팅 '+num(G.bet)+'</div><div id="evx"></div>');
const cups=[...document.querySelectorAll(".cup")],T=(f,ms)=>setTimeout(()=>{if(G&&G.id==id)f()},ms);
T(()=>cups[G.pos].classList.add("lift"),500);T(()=>cups[G.pos].classList.remove("lift"),1900);
const sh=n=>{if(n<=0){cups.forEach(x=>x.disabled=false);$("evt").textContent="주사위가 든 컵을 고르세요";return}
const a=rnd(5);let b=rnd(4);if(b>=a)b++;const t=G.sl[a];G.sl[a]=G.sl[b];G.sl[b]=t;
cups[a].style.left=G.sl[a]*20+"%";cups[b].style.left=G.sl[b]*20+"%";cups[a].style.top="18px";cups[b].style.top="50px";
setTimeout(()=>{cups[a].style.top="";cups[b].style.top=""},170);T(()=>sh(n-1),n>6?360:290)};
T(()=>{$("evt").textContent="섞는 중…";sh(11)},2500)}
function pickCup(c){const cups=[...document.querySelectorAll(".cup")];cups.forEach(x=>x.disabled=true);cups[c].classList.add("lift");
if(c!=G.pos){cups[G.pos].classList.add("lift");const l=Math.ceil(G.bet*.5);S.money=Math.max(0,S.money-l);$("evt").textContent="꽝!";
$("evx").innerHTML='<div class="evt" style="color:#ff8a8a">-'+num(l)+'</div><div class="evr"><button data-a="no">확인</button></div>';return}
G.w=Math.floor(G.bet*1.5);G.face=rnd(6)+1;let f='';for(let i=1;i<=6;i++)f+='<button data-f="'+i+'">'+i+'</button>';
$("evt").innerHTML='정답! +'+num(G.w)+'<br><small style="color:var(--gold)">주사위 눈도 맞히면 배팅의 4배 보너스!</small>';
$("evx").innerHTML='<div class="fc">'+f+'</div><div class="evr"><button data-f="0">눈은 안 맞힐래요</button></div>'}
function pickFace(f){let w=G.w,m="";const dc=document.querySelector(".dc");if(dc)dc.innerHTML=dieB(G.face);
if(f&&f==G.face){w+=G.bet*4;m="눈 적중! 보너스 +"+num(G.bet*4)}else if(f)m="주사위 눈은 "+G.face+"이었어요";S.money+=w;coin();
$("evt").textContent="";$("evx").innerHTML='<div class="evt" style="color:#7dffb0">+'+num(w)+'</div>'+(m?'<div class="evs" style="font-size:14px;margin-bottom:8px">'+m+'</div>':'')+'<div class="evr"><button data-a="no">확인</button></div>'}
$("evb").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.p){$("bsl").value=d.p;betShow()}else if(d.a=="no")evClose();else if(d.a=="yes")betStep();else if(d.a=="go")cupStep();else if(d.c!=null)pickCup(+d.c);else if(d.f!=null)pickFace(+d.f)});
$("evb").addEventListener("input",betShow);
// ---- tutorial ----
let tutOn=false,tutI=0;
const TUT=[["#hud","손님은 자동으로 와요.<br>위에서 시간과 돈을 확인해요.",0],['[data-t="0"]',"노래가 끝나면 <b>완료</b>를 눌러 돈을 받아요.",0],['[data-t="1"]',"자판기에 팔 음식을 주문해요.<br>주문을 꾹 누르면 계속 주문돼요.",1],['[data-t="2"]',"창고 음식을 자판기에 채워야 팔려요.",2],['[data-t="3"]',"홍보하면 손님이 늘어요.",3],['[data-t="4"]',"방을 꾸미면 더 빠르고 비싸게 불러요.",4],['[data-t="5"]',"알바생이 대신 청소하고 음식도 채워요.",5],["#fv","퀴즈를 맞히면 3분 동안 2배 빨라져요!",0]];
function tutShow(i){document.querySelectorAll(".tl").forEach(x=>x.classList.remove("tl"));
if(i>=TUT.length){tutOn=false;S.tut=1;$("tut").style.display="none";setTab(0);save();return}
tutI=i;const s=TUT[i];setTab(s[2]);const el=document.querySelector(s[0]);if(el)el.classList.add("tl");
$("tt").innerHTML=s[1];$("tn").textContent=i==TUT.length-1?"시작":"다음";$("tp").textContent=(i+1)+"/"+TUT.length;$("tut").style.display="block"}
function startTut(){tutOn=true;tutShow(0)}
$("tn").onclick=()=>tutShow(tutI+1);$("tk").onclick=()=>tutShow(99);
// ---- start ----
$("play").onclick=()=>{started=true;initAudio();bgmOn();$("st").style.display="none";last=performance.now();catchUp();if(!S.tut)startTut()};
document.addEventListener("contextmenu",e=>e.preventDefault());

let rsT=0;$("rs").onclick=()=>{const b=$("rs");if(!rsT){b.textContent="정말 지울까요? 한 번 더 누르세요";rsT=setTimeout(()=>{rsT=0;b.textContent="처음부터 다시 시작"},4000)}else{window.noSave=true;try{localStorage.removeItem(KEY);localStorage.removeItem("kara_seen")}catch(x){}location.reload()}};

build();draw();setInterval(tick,250);setInterval(walkLoop,80);
