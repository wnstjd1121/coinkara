(()=>{const row=$("lrow");if(!row)return;
row.addEventListener("wheel",e=>{const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(!d)return;e.preventDefault();if(row._w)return;row._w=1;setTimeout(()=>row._w=0,380);row.scrollTo({left:d>0?row.scrollWidth:0,behavior:"smooth"})},{passive:false});
let dn=null,mv=0;
row.addEventListener("pointerdown",e=>{if(e.pointerType!="mouse"||e.button)return;dn={x:e.clientX,s:row.scrollLeft};mv=0;row.style.scrollSnapType="none";row.style.cursor="grabbing"});
window.addEventListener("pointermove",e=>{if(!dn)return;const dx=e.clientX-dn.x;if(Math.abs(dx)>5)mv=1;row.scrollLeft=dn.s-dx});
const end=e=>{if(!dn)return;const dx=e.clientX-dn.x;dn=null;row.style.cursor="";const mid=row.scrollWidth/2-row.clientWidth/2;row.style.scrollSnapType="";row.scrollTo({left:row.scrollLeft>mid*.5?row.scrollWidth:0,behavior:"smooth"})};
window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);
row.addEventListener("click",e=>{if(mv){e.stopPropagation();e.preventDefault();mv=0}},true)})();
